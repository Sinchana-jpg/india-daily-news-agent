name: India Daily News

on:
  workflow_dispatch:
  schedule:
    # 07:00 India Standard Time = 01:30 UTC
    - cron: "30 1 * * *"

permissions:
  contents: write

concurrency:
  group: india-daily-news
  cancel-in-progress: false

jobs:
  build-news-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect and analyze news
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python news_agent.py
      - name: Commit updated news files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/DAILY_NEWS.md reports/daily data/news.json
          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "chore: update India daily news brief"
            git push
          fi
